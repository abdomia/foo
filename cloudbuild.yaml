steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/foo-platform', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/foo-platform']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run', 'deploy', 'foo-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/foo-platform'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
